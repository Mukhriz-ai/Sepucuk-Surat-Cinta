<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Sayang 💖</title>
    <!-- Masukkan font comel Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(255, 77, 109, 0.2);
            width: 90%;
            max-width: 450px;
            text-align: center;
            z-index: 10;
            position: relative;
            backdrop-filter: blur(5px);
            border: 2px solid #fff;
        }

        h1 {
            color: #ff4d6d;
            font-size: 24px;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* Counter Masa Bersama */
        .counter-box {
            background: #fff0f3;
            padding: 12px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 1px dashed #ff4d6d;
        }

        .counter-box h3 {
            color: #ff4d6d;
            font-size: 13px;
            margin-bottom: 5px;
        }

        #timer {
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }

        /* Menu Tindakan (Tabs) */
        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .action-btn {
            background: #fff;
            border: 2px solid #ff4d6d;
            color: #ff4d6d;
            padding: 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .action-btn:hover {
            background: #ff4d6d;
            color: white;
            transform: translateY(-2px);
        }

        /* Bahagian Soalan Utama */
        .question-section {
            margin-top: 15px;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            position: relative;
            min-height: 110px;
            margin-top: 15px;
        }

        .main-btn {
            background-color: #ff4d6d;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
        }

        .main-btn:hover {
            background-color: #ff1a40;
            transform: scale(1.05);
        }

        #btnNo {
            background-color: #e0e0e0;
            color: #555;
            position: relative;
            box-shadow: none;
            transition: top 0.1s ease, left 0.1s ease;
        }

        /* Kotak Popup Mesej Interaktif */
        .popup-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .popup-content {
            background: white;
            padding: 25px;
            border-radius: 20px;
            width: 85%;
            max-width: 320px;
            text-align: center;
            position: relative;
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .popup-content h3 {
            color: #ff4d6d;
            margin-bottom: 10px;
        }

        .popup-content p {
            color: #444;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .close-popup {
            background: #ff4d6d;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 15px;
            cursor: pointer;
        }

        /* Animasi Hati Background */
        .heart {
            position: absolute;
            top: -10px;
            color: #ff4d6d;
            font-size: 18px;
            user-select: none;
            z-index: 1;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Hai Assalamualaikum Awak! 👩‍❤️‍👨</h1>
        <p>Senanya ni lah job intern saya kat sini HAHAHHA.</p>

        <!-- Counter Masa -->
        <div class="counter-box">
            <h3>⏰ Kita dah bersama selama:</h3>
            <div id="timer">Mengira masa...</div>
        </div>

        <!-- Pilihan Aksi Interaktif (Tab) -->
        <p>Cuba tekan butang di bawah ni 👇</p>
        <div class="action-grid">
            <button class="action-btn" onclick="openPopup('reasons')">💌 Kenapa Sayang?</button>
            <button class="action-btn" onclick="openPopup('promise')">💍 Janji Saya</button>
        </div>

        <!-- Soalan Utama -->
        <div class="question-section">
            <h2 style="font-size: 16px; color: #333; margin-bottom: 10px;">Awak sayang saya tak? 🥺</h2>
            <div class="btn-group">
                <button class="main-btn" id="btnYes" onclick="sayYes()">Mestilah! 🥰</button>
                <!-- Menggunakan onmouseover dan onmousedown supaya ia lari bila tetikus sentuh atau cuba klik -->
                <button class="main-btn" id="btnNo" onmouseover="moveButton()" onmousedown="moveButton()">Tak Nak 😜</button>
            </div>
        </div>
    </div>

    <!-- Popup Window -->
    <div class="popup-modal" id="popupModal">
        <div class="popup-content">
            <h3 id="popupTitle">Tajuk</h3>
            <p id="popupText">Mesej di sini...</p>
            <button class="close-popup" onclick="closePopup()">Tutup 💖</button>
        </div>
    </div>

    <script>
        // 1. KIRA MASA BERSAMA
        const startDate = new Date("2026-07-16T07:15:30"); 

        function updateTimer() {
            const now = new Date();
            const diff = now - startDate;
            
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / 1000 / 60) % 60);
            
            document.getElementById("timer").innerHTML = `${days} Hari, ${hours} Jam, ${minutes} Minit 💕`;
        }
        setInterval(updateTimer, 1000);
        updateTimer();

        // 2. SISTEM POPUP INTERAKTIF
        const popupData = {
            reasons: {
                title: "Kenapa Saya Sayang Awak? 💌",
                text: "Sebab awak dah sempurna melengkapi hari saya"
            },
            promise: {
                title: "Janji Saya 💍",
                text: "Saya berjanji akan sentiasa ada di sisi awak susah dan senang, jaga awak, dan buat awak tersenyum setiap hari."
            }
        };

        function openPopup(type) {
            const modal = document.getElementById("popupModal");
            document.getElementById("popupTitle").innerText = popupData[type].title;
            document.getElementById("popupText").innerText = popupData[type].text;
            modal.style.display = "flex";
        }

        function closePopup() {
            document.getElementById("popupModal").style.display = "none";
        }

      // 3. BUTANG "TAK NAK" LARI MERATA SKRIN TETAPI DI DALAM BOUNDARY
        function moveButton() {
            const btnNo = document.getElementById("btnNo");
            
            btnNo.style.position = "fixed";
            
            const screenWidth = window.innerWidth;
            const screenHeight = window.innerHeight;
            
            const btnWidth = btnNo.offsetWidth;
            const btnHeight = btnNo.offsetHeight;
            
            // Tetapkan jarak selamat (padding) dari tepi skrin supaya butang tak terkeluar langsung
            const padding = 20;
            
            const minX = padding;
            const maxX = screenWidth - btnWidth - padding;
            
            const minY = padding;
            const maxY = screenHeight - btnHeight - padding;
            
            // Dapatkan koordinat rawak dalam zon selamat skrin
            const randomX = Math.floor(Math.random() * (maxX - minX + 1)) + minX;
            const randomY = Math.floor(Math.random() * (maxY - minY + 1)) + minY;
            
            btnNo.style.left = randomX + "px";
            btnNo.style.top = randomY + "px";
        }

        // 4. BILA TEKAN "Mestilah!"
        function sayYes() {
            alert("Yeay! I love you more! 🥰💖 ");
        }

        // 5. ANIMASI LATAR BELAKANG HATI
        function createHeart() {
            const heart = document.createElement("div");
            heart.classList.add("heart");
            heart.innerHTML = "❤️";
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = (Math.random() * 3 + 2) + "s";
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }
        setInterval(createHeart, 250);
    </script>

</body>
</html>
